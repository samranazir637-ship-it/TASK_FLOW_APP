[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "taskflow-backend"
version = "0.1.0"
description = "TaskFlow database foundation"
requires-python = ">=3.12"
dependencies = [
  "APScheduler>=3.10,<4",
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "email-validator>=2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "Pillow>=13,<14",
  "PyJWT>=2.9,<3",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.9,<1",
  "pydantic-settings>=2.4,<3",
  "slowapi>=0.1.9,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pip-audit>=2.7,<3", "pytest>=9.0.3,<10", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
